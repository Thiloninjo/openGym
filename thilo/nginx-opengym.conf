# nginx-Server-Block für openGym auf dem Hetzner, nach web/nginx.conf.template ohne Docker.
# Ziel: /etc/nginx/sites-available/opengym, verlinkt nach sites-enabled. Certbot ergänzt HTTPS.
server {
    listen 80;
    server_name gym.46-225-160-248.nip.io;
    root /var/www/opengym;
    index index.html;
    absolute_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ^~ /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /api/media/ {
        client_max_body_size 48m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Ad-hoc-Installation der iPhone-App (Codemagic legt ipa und Manifest hier ab).
    location ^~ /install/ {
        alias /var/www/opengym-install/;
        types { application/octet-stream ipa; text/xml plist; text/html html; image/png png; }
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ @root;
    }
    location @root {
        return 302 /$is_args$args;
    }
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /exercise-media/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|mp4)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
